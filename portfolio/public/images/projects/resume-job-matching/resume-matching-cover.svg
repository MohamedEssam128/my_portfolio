<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020817"/>
      <stop offset="50%" stop-color="#071b26"/>
      <stop offset="100%" stop-color="#020817"/>
    </linearGradient>
    <pattern id="grid4" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#bg4)"/>
  <rect width="800" height="450" fill="url(#grid4)"/>

  <!-- Left: Candidate Profile Doc -->
  <g transform="translate(180, 110)">
    <rect width="130" height="170" rx="8" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5"/>
    <rect x="15" y="20" width="40" height="40" rx="20" fill="#0891b2" opacity="0.4"/>
    <line x1="65" y1="30" x2="115" y2="30" stroke="#06b6d4" stroke-width="2"/>
    <line x1="65" y1="45" x2="105" y2="45" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
    <line x1="15" y1="80" x2="115" y2="80" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
    <line x1="15" y1="100" x2="115" y2="100" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
    <line x1="15" y1="120" x2="90" y2="120" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
    <rect x="15" y="140" width="45" height="16" rx="4" fill="#0e7490"/>
    <text x="37" y="152" fill="#ecfeff" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">SKILLS</text>
  </g>

  <!-- Center: Match Engine / NLP Cosine Similarity representation -->
  <g transform="translate(370, 160)">
    <circle cx="30" cy="35" r="32" fill="#083344" stroke="#22d3ee" stroke-width="2"/>
    <path d="M 20 35 L 28 43 L 42 27" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round"/>
    <text x="30" y="80" fill="#67e8f9" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">NLP MATCH</text>
  </g>

  <!-- Connectors -->
  <line x1="310" y1="195" x2="368" y2="195" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="432" y1="195" x2="490" y2="195" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Right: Job Listing Doc -->
  <g transform="translate(490, 110)">
    <rect width="130" height="170" rx="8" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5"/>
    <rect x="15" y="20" width="100" height="18" rx="4" fill="#155e75"/>
    <text x="65" y="32" fill="#cffafe" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">JOB SPECIFICATION</text>
    <line x1="15" y1="60" x2="115" y2="60" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
    <line x1="15" y1="80" x2="115" y2="80" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
    <line x1="15" y1="100" x2="95" y2="100" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
    <rect x="15" y="130" width="70" height="24" rx="6" fill="#0891b2"/>
    <text x="50" y="146" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Relevance Rank</text>
  </g>

  <!-- Title Banner -->
  <rect x="120" y="360" width="560" height="54" rx="12" fill="rgba(15,23,42,0.8)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="400" y="385" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">AI RESUME-TO-JOB MATCHING SYSTEM</text>
  <text x="400" y="403" fill="#67e8f9" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">NLP Extraction · Candidate Profiling · Semantic Relevance Ranking</text>
</svg>
