<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020817"/>
      <stop offset="50%" stop-color="#1c1004"/>
      <stop offset="100%" stop-color="#020817"/>
    </linearGradient>
    <linearGradient id="bar-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <pattern id="grid3" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#bg3)"/>
  <rect width="800" height="450" fill="url(#grid3)"/>

  <!-- Analytics Chart Representation -->
  <g transform="translate(180, 100)">
    <!-- Axes -->
    <line x1="0" y1="180" x2="440" y2="180" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="0" y2="180" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>

    <!-- Bar chart elements -->
    <rect x="30" y="100" width="30" height="80" rx="4" fill="url(#bar-grad)" opacity="0.8"/>
    <rect x="90" y="60" width="30" height="120" rx="4" fill="url(#bar-grad)" opacity="0.85"/>
    <rect x="150" y="85" width="30" height="95" rx="4" fill="url(#bar-grad)" opacity="0.8"/>
    <rect x="210" y="40" width="30" height="140" rx="4" fill="url(#bar-grad)" opacity="0.9"/>
    <rect x="270" y="55" width="30" height="125" rx="4" fill="url(#bar-grad)" opacity="0.85"/>
    <rect x="330" y="25" width="30" height="155" rx="4" fill="url(#bar-grad)" opacity="0.95"/>
    <rect x="390" y="15" width="30" height="165" rx="4" fill="url(#bar-grad)" opacity="1.0"/>

    <!-- Regression Trend Line -->
    <line x1="20" y1="120" x2="420" y2="10" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="6 4"/>
    <circle cx="420" cy="10" r="5" fill="#38bdf8"/>
    <!-- Forecast Tag -->
    <rect x="360" y="-20" width="90" height="24" rx="4" fill="#0369a1" stroke="#38bdf8" stroke-width="1"/>
    <text x="405" y="-5" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">FORECAST</text>
  </g>

  <!-- Tags -->
  <rect x="150" y="40" width="130" height="32" rx="6" fill="rgba(249,115,22,0.12)" stroke="rgba(249,115,22,0.3)" stroke-width="1"/>
  <text x="215" y="61" fill="#fb923c" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">SQL + MongoDB</text>

  <rect x="520" y="40" width="130" height="32" rx="6" fill="rgba(249,115,22,0.12)" stroke="rgba(249,115,22,0.3)" stroke-width="1"/>
  <text x="585" y="61" fill="#fb923c" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Power BI Analytics</text>

  <!-- Title Banner -->
  <rect x="120" y="360" width="560" height="54" rx="12" fill="rgba(15,23,42,0.8)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="400" y="385" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">RETAIL DATA ANALYSIS &amp; SALES FORECASTING</text>
  <text x="400" y="403" fill="#fb923c" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Relational SQL · MongoDB · Python · Power BI · Linear Regression</text>
</svg>
