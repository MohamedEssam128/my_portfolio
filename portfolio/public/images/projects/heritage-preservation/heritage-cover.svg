<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020817"/>
      <stop offset="50%" stop-color="#09132e"/>
      <stop offset="100%" stop-color="#020817"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#grid)"/>

  <!-- Radar / 3D scan rings -->
  <circle cx="400" cy="200" r="140" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 6" opacity="0.3"/>
  <circle cx="400" cy="200" r="100" fill="none" stroke="#818cf8" stroke-width="1" stroke-dasharray="6 8" opacity="0.4"/>
  <circle cx="400" cy="200" r="60" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>
  <circle cx="400" cy="200" r="20" fill="#38bdf8" opacity="0.2"/>
  <circle cx="400" cy="200" r="4" fill="#38bdf8"/>

  <!-- 3D Statue Mesh / Point Cloud representation -->
  <g stroke="#38bdf8" stroke-width="1.2" opacity="0.75" fill="none">
    <!-- Statue wireframe head & body -->
    <path d="M 380 140 Q 400 120 420 140 Q 425 170 415 190 L 425 250 L 375 250 L 385 190 Z" />
    <path d="M 370 160 L 430 160" stroke-dasharray="2 3"/>
    <path d="M 365 200 L 435 200" stroke-dasharray="3 3"/>
    <path d="M 360 230 L 440 230" stroke-dasharray="2 4"/>
    <!-- Scanner bounding box -->
    <rect x="340" y="110" width="120" height="160" rx="8" fill="none" stroke="#818cf8" stroke-width="1" stroke-dasharray="5 5" opacity="0.5"/>
    <!-- YOLO Corner brackets -->
    <path d="M 330 130 L 330 100 L 360 100" stroke="#38bdf8" stroke-width="2"/>
    <path d="M 470 130 L 470 100 L 440 100" stroke="#38bdf8" stroke-width="2"/>
    <path d="M 330 250 L 330 280 L 360 280" stroke="#38bdf8" stroke-width="2"/>
    <path d="M 470 250 L 470 280 L 440 280" stroke="#38bdf8" stroke-width="2"/>
  </g>

  <!-- Metrics callout chips -->
  <rect x="180" y="70" width="140" height="36" rx="8" fill="rgba(14,165,233,0.12)" stroke="rgba(14,165,233,0.3)" stroke-width="1"/>
  <text x="250" y="93" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Detection: >95%</text>

  <rect x="480" y="70" width="140" height="36" rx="8" fill="rgba(129,140,248,0.12)" stroke="rgba(129,140,248,0.3)" stroke-width="1"/>
  <text x="550" y="93" fill="#818cf8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">mAP@50: 91%</text>

  <!-- Project Title Banner -->
  <rect x="120" y="360" width="560" height="54" rx="12" fill="rgba(15,23,42,0.8)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="400" y="385" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">HERITAGE PRESERVATION AI SYSTEM</text>
  <text x="400" y="403" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">YOLO · 3D Photogrammetry · Robotics · Damage Heatmap</text>
</svg>
