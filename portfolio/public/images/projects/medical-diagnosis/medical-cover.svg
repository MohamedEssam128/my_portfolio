<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020817"/>
      <stop offset="50%" stop-color="#150a2b"/>
      <stop offset="100%" stop-color="#020817"/>
    </linearGradient>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#bg2)"/>
  <rect width="800" height="450" fill="url(#grid2)"/>

  <!-- BiLSTM Recurrent Cells & Medical Signal Wave -->
  <path d="M 120 200 Q 200 160 280 200 T 440 200 T 600 200 T 680 200" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4"/>

  <!-- ECG pulse wave representation in center -->
  <path d="M 150 200 L 290 200 L 310 180 L 325 240 L 345 130 L 365 260 L 380 190 L 395 205 L 410 200 L 650 200" fill="none" stroke="#c084fc" stroke-width="2.5"/>

  <!-- BiLSTM Nodes (Forward / Backward) -->
  <g fill="#1e1b4b" stroke="#a855f7" stroke-width="1.5">
    <!-- Top Forward row -->
    <rect x="240" y="100" width="70" height="34" rx="6"/>
    <text x="275" y="122" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">LSTM →</text>

    <rect x="365" y="100" width="70" height="34" rx="6"/>
    <text x="400" y="122" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">LSTM →</text>

    <rect x="490" y="100" width="70" height="34" rx="6"/>
    <text x="525" y="122" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">LSTM →</text>

    <!-- Bottom Backward row -->
    <rect x="240" y="270" width="70" height="34" rx="6"/>
    <text x="275" y="292" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">← LSTM</text>

    <rect x="365" y="270" width="70" height="34" rx="6"/>
    <text x="400" y="292" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">← LSTM</text>

    <rect x="490" y="270" width="70" height="34" rx="6"/>
    <text x="525" y="292" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">← LSTM</text>
  </g>

  <!-- Connectors -->
  <line x1="310" y1="117" x2="365" y2="117" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="435" y1="117" x2="490" y2="117" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="490" y1="287" x2="435" y2="287" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="365" y1="287" x2="310" y2="287" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Validation tags -->
  <rect x="140" y="50" width="150" height="34" rx="8" fill="rgba(168,85,247,0.12)" stroke="rgba(168,85,247,0.3)" stroke-width="1"/>
  <text x="215" y="72" fill="#c084fc" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Val Acc: 93%</text>

  <rect x="510" y="50" width="150" height="34" rx="8" fill="rgba(192,132,252,0.12)" stroke="rgba(192,132,252,0.3)" stroke-width="1"/>
  <text x="585" y="72" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">F1-Score: 91%</text>

  <!-- Title Banner -->
  <rect x="120" y="360" width="560" height="54" rx="12" fill="rgba(15,23,42,0.8)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="400" y="385" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">MEDICAL DIAGNOSIS NLP SYSTEM</text>
  <text x="400" y="403" fill="#c084fc" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">NHS Dataset · Transformers Augmentation · BiLSTM Architecture</text>
</svg>
